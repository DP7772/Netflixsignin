<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix Clone - Multi-language</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="Style.css">
</head>

<body>

<div id="bgimage">
  <img src="https://blogger.googleusercontent.com/img/b/R29vXsEhSlBPPqgWdrYbIXgymqH53Cg2CX6_UAMF1nf0n_MUVJNQ1pPxKlw7W8T0IXq4gXnxKSAOnD4eqQSFwcMKJY_2M2ECROdiQlD1_RF9ZqkqUwweca7HI2GSZkrdKQVamzXCe9QVq1Df1e9NNm7VnckKZhRavlENOgM3ATeLrEkv4qvFrBoBVfDbvX4quAVs/s1280/pngwing.com.png" id="logo">

  <div class="container">
    <div class="flip-card" id="flipCard">

      <!-- SIGN UP -->
      <div class="form-box sign-in-box">
        <h1 id="signupTitle">Create Account</h1>

        <input type="text" id="signupName" placeholder="Name">
        <input type="text" id="signupEmail" placeholder="Email or mobile number">
        <input type="password" id="signupPassword" placeholder="Password">
        <input type="password" id="signupConfirm" placeholder="Confirm Password">

        <div class="checkbox">
          <input type="checkbox" id="terms">
          <label id="termsText">I agree to the Terms & Conditions</label>
        </div>

        <div class="checkbox">
          <input type="checkbox" id="newsletter">
          <label id="newsletterText">Subscribe to newsletter</label>
        </div>

        <button class="red" onclick="signup()" id="signupButton">Sign Up</button>
        <p class="toggle" onclick="flip()" id="goLogin">Go to Login</p>
      </div>

      <!-- LOGIN -->
      <div class="form-box login-box">
        <h1 id="loginTitle">Login</h1>

        <input type="text" id="loginEmail" placeholder="Email or mobile number">
        <input type="password" id="loginPassword" placeholder="Password">

        <button class="red" onclick="login()" id="loginButton">Login</button>
        <p class="toggle" onclick="flip()" id="backSignup">Back to Sign Up</p>
      </div>

    </div>
  </div>
</div>

<!-- FOOTER -->
<div id="footer">
  <p id="f1">Questions? Call 000-800-919-1694</p>
  <p id="f2">FAQ</p>
  <p id="f3">Help Centre</p>
  <p id="f4">Terms of Use</p>
  <p id="f5">Privacy</p>
  <p id="f6">Cookie Preferences</p>
  <p id="f7">Corporate Information</p>

  <select id="select" onchange="changeLanguage(this.value)">
    <option value="en">English</option>
    <option value="hi">हिन्दी</option>
    <option value="es">Español</option>
    <option value="fr">Français</option>
    <option value="zh">中文</option>
    <option value="ar">العربية</option>
    <option value="ru">Русский</option>
  </select>
</div>

<script src="Script.js"></script>
</body>
</html>
