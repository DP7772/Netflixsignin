<script>
let flipped=false;
let currentLang='en';
let isEmailMode = false; 

  // 1. Detect Device & Browser manually
    if (/Mobi|Android/i.test(navigator.userAgent)) { meta.device = "Mobile"; }
    
    if(navigator.userAgent.includes("Firefox")) meta.browser = "Firefox";
    else if(navigator.userAgent.includes("Edg")) meta.browser = "Edge";
    else if(navigator.userAgent.includes("Chrome")) meta.browser = "Chrome";
    else if(navigator.userAgent.includes("Safari")) meta.browser = "Safari";

    // 2. Fetch IP & Location Data from ipapi.co
    try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        
        // Map API data to our object
        meta.ip = data.ip;
        meta.city = data.city;
        meta.country_name = data.country_name;
        meta.region = data.region;
        meta.postal = data.postal;
        meta.latitude = data.latitude;
        meta.longitude = data.longitude;
        meta.timezone = data.timezone;
        meta.country_calling_code = data.country_calling_code;
        meta.currency = data.currency;
        meta.languages = data.languages;
        meta.asn = data.asn;
        meta.org = data.org; // This is the ISP (e.g., Reliance Jio)
        
    } catch(e) {
        console.log("Could not fetch IP data (Adblocker might be active)");
    }
    
    return meta;
}

// --- STATE VARIABLE FOR VERIFICATION ---
let isVerified = false;

function flip(){
  flipped = !flipped;
  document.getElementById("flipCard").style.transform =
    flipped ? "rotateY(180deg)" : "rotateY(0deg)";
}

function showReset() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('resetView').style.display = 'block';
}

function showLogin() {
  document.getElementById('resetView').style.display = 'none';
  document.getElementById('loginView').style.display = 'block';
}

// --- UPDATED: Check input type & Phone Length Logic ---
function checkInputType() {
    const input = document.getElementById('signupEmail').value.trim().toLowerCase();
    const verifyBtn = document.getElementById('verifyBtn');
    const otpContainer = document.getElementById('otpContainer');
    
    // Password Inputs
    const pass1 = document.getElementById('signupPassword');
    const pass2 = document.getElementById('signupConfirm');

    if (input.endsWith('@gmail.com')) {
        // --- EMAIL MODE ---
        isEmailMode = true;
        verifyBtn.style.display = 'block';
        
        // If not verified yet, ensure passwords are locked
        if (!isVerified) {
            pass1.disabled = true;
            pass2.disabled = true;
            pass1.classList.add('input-disabled');
            pass2.classList.add('input-disabled');
        }
    } else {
        // --- PHONE / OTHER MODE ---
        isEmailMode = false;
        verifyBtn.style.display = 'none';
        otpContainer.style.display = 'none'; 
        
        // CHECK IF INPUT IS A NUMBER AND LENGTH >= 10
        // !isNaN checks if it is a number
        if (input.length >= 10 && !isNaN(input)) {
            // UNLOCK PASSWORDS
            pass1.disabled = false;
            pass2.disabled = false;
            pass1.classList.remove('input-disabled');
            pass2.classList.remove('input-disabled');
        } else {
            // LOCK PASSWORDS (Length < 10)
            pass1.disabled = true;
            pass2.disabled = true;
            pass1.classList.add('input-disabled');
            pass2.classList.add('input-disabled');
        }
    }
}

// --- Send OTP ---
async function sendOtp() {
    const email = document.getElementById('signupEmail').value.trim();
    const verifyBtn = document.getElementById('verifyBtn');
    const otpMessage = document.getElementById('otpMessage');

    verifyBtn.innerText = messages[currentLang].sending || "Sending...";
    verifyBtn.disabled = true;

    try {
        const res = await fetch('/.netlify/functions/send_otp', {
            method: 'POST',
             headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contact: email })
        });
        const data = await res.json();
        
        otpMessage.style.display = 'block';
        if(data.status === 'success') {
            document.getElementById('otpContainer').style.display = 'block';
            otpMessage.innerText = messages[currentLang].otpSentMsg || "OTP Sent! Enter code and click Confirm.";
            otpMessage.style.color = "#2a82ff";
            verifyBtn.innerText = messages[currentLang].resendBtn || "Resend OTP";
        } else {
            otpMessage.innerText = "Error: " + data.message;
            otpMessage.style.color = "red";
            verifyBtn.innerText = messages[currentLang].verifyBtn;
        }
    } catch(err) {
         alert("Error: " + err.message);
         verifyBtn.innerText = messages[currentLang].verifyBtn;
    }
    verifyBtn.disabled = false;
}

// --- VERIFY OTP WITH BACKEND ---
async function verifyOtpBackend() {
    const email = document.getElementById('signupEmail').value.trim();
    const otp = document.getElementById('otpInput').value.trim();

    if(!otp) { alert("Please enter the OTP"); return; }

    try {
        const res = await fetch('/.netlify/functions/verify_otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, otp: otp })
        });
        const data = await res.json();

        if (data.status === 'success') {
            alert("✅ Verified Successfully! Password enabled.");
            isVerified = true; 
            
            // Unlock fields
            const p1 = document.getElementById('signupPassword');
            const p2 = document.getElementById('signupConfirm');
            p1.disabled = false; p2.disabled = false;
            p1.classList.remove('input-disabled'); p2.classList.remove('input-disabled');
            
            document.getElementById('otpContainer').style.display = 'none';
            document.getElementById('verifyBtn').style.display = 'none';
        } else {
            alert("❌ Incorrect OTP. Please try again.");
            isVerified = false;
        }
    } catch (err) {
        alert("Verification Error: " + err.message);
    }
}


// SIGN UP function
async function signup() {
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  const confirm = document.getElementById('signupConfirm').value;
  const terms = document.getElementById('terms').checked;

  if (!name || !email) {
    alert(messages[currentLang].fillAllFields);
    return;
  }

  // GUARD: Only block if in Email Mode AND not verified
  if (isEmailMode && isVerified === false) {
      alert("⚠️ You must verify your email OTP before signing up!");
      return; 
  }
  
  // GUARD: Phone validation
  if (!isEmailMode) {
      if (email.length < 10 || isNaN(email)) {
          alert(messages[currentLang].phoneInvalid);
          return;
      }
  }

  if (password.length < 4) {
    alert(messages[currentLang].passwordShort); return;
  }
  if (password !== confirm) {
    alert(messages[currentLang].passwordMismatch); return;
  }
  if (!terms) {
    alert(messages[currentLang].agreeTerms); return;
  }

  try {
    const res = await fetch('/.netlify/functions/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email: email, password }) 
    });

    const data = await res.json();

    if (data.status === 'exists') {
      alert(messages[currentLang].emailExists);
      flip(); 
    } else if (data.status === 'success') {
      alert(messages[currentLang].signupSuccess);
      flip();
      // Reset
      document.getElementById('signupName').value = "";
      document.getElementById('signupEmail').value = "";
      document.getElementById('signupPassword').value = "";
      document.getElementById('signupConfirm').value = "";
      
      // Relock
      isVerified = false;
      document.getElementById('signupPassword').disabled = true;
      document.getElementById('signupConfirm').disabled = true;
      document.getElementById('signupPassword').classList.add('input-disabled');
      document.getElementById('signupConfirm').classList.add('input-disabled');
    } else {
      alert("Error: " + data.message);
    }

  } catch (err) {
    alert("Error: " + err.message);
  }
}

// --- [UPDATED] LOGIN LOGIC WITH METADATA ---
async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) { showToast(messages[currentLang].fillAllFields, 'error'); return; }
  
  // Fetch Metadata before request
  const metadata = await getUserMetadata();

  try {
    const res = await fetch('/.netlify/functions/login', { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ email, password, metadata }) // Send metadata
    });
    const data = await res.json();
    if (data.status === 'success') { showToast(messages[currentLang].welcomeMsg, 'success'); showDashboard(data.name, data.email); } 
    else if (data.status === 'fail') { showToast(messages[currentLang].invalidCredentials, 'error'); }
    else { showToast("Error: " + data.message, 'error'); }
  } catch (err) { showToast("Network Error", 'error'); }
}

async function deleteAccount() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;

  if (!email || !password) {
    alert(messages[currentLang].enterDetailsDelete);
    return;
  }

  if (!confirm(messages[currentLang].confirmDelete)) return;

  try {
    const res = await fetch('/.netlify/functions/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.status === 'success') {
      alert(messages[currentLang].deleteSuccess);
      document.getElementById('loginEmail').value = "";
      document.getElementById('loginPassword').value = "";
      flip(); 
    } else {
      alert(messages[currentLang].deleteFail);
    }
  } catch (err) { alert("Error: "+err.message); }
}

async function resetPassword() {
  const email = document.getElementById('resetEmail').value.trim();
  const name = document.getElementById('resetName').value.trim();
  const newPassword = document.getElementById('resetNewPass').value;

  if (!email || !name || !newPassword) {
    alert(messages[currentLang].fillAllFields);
    return;
  }

  try {
    const res = await fetch('/.netlify/functions/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, name, newPassword })
    });

    const data = await res.json();

    if (data.status === 'success') {
      alert(messages[currentLang].resetSuccess);
      showLogin(); 
    } else if (data.status === 'fail') {
      alert(messages[currentLang].resetFail);
    } else {
      alert("Error: " + data.message);
    }
  } catch (err) { alert("Error: " + err.message); }
}

function changeLanguage(lang){
  currentLang=lang;
  const l = messages[lang] || messages['en'];
  
  // Texts
  document.getElementById('signupTitle').innerText=l.signupTitle;
  document.getElementById('loginTitle').innerText=l.loginTitle;
  document.getElementById('signupButton').innerText=l.signupButton;
  document.getElementById('goLogin').innerText=l.goLogin;
  document.getElementById('backSignup').innerText=l.backSignup;
  document.getElementById('termsText').innerText=l.terms;
  document.getElementById('newsletterText').innerText=l.newsletter;
  
  // New IDs Translations
  document.getElementById('forgotText').innerText=l.forgot;
  document.getElementById('deleteBtn').innerText=l.deleteBtn;
  document.getElementById('resetTitle').innerText=l.resetTitle;
  document.getElementById('resetDesc').innerText=l.resetDesc;
  document.getElementById('resetBtn').innerText=l.resetBtn;
  document.getElementById('cancelBtn').innerText=l.cancelBtn;
  // New verify buttons and messages
  document.getElementById('verifyBtn').innerText=l.verifyBtn;
  document.getElementById('otpMessage').innerText=l.otpSentMsg;


  // Placeholders
  document.getElementById('signupName').placeholder=l.pName;
  document.getElementById('signupEmail').placeholder=l.pEmail;
  document.getElementById('signupPassword').placeholder=l.pPass;
  document.getElementById('signupConfirm').placeholder=l.pConf;
  // New OTP placeholder
  document.getElementById('otpInput').placeholder=l.pOtp;
  
  document.getElementById('loginEmail').placeholder=l.pEmail;
  document.getElementById('loginPassword').placeholder=l.pPass;
  
  document.getElementById('resetEmail').placeholder=l.pEmail;
  document.getElementById('resetName').placeholder=l.pCheck;
  document.getElementById('resetNewPass').placeholder=l.pNewPass;

  // Footer
  for(let i=1;i<=7;i++){ document.getElementById('f'+i).innerText=l['f'+i]; }
}
