<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix Clone - Multi-language</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
body { background:black; color:white; }

#bgimage {
  min-height:100vh;
  background:url("https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgMvwYm6yxnPrMyAlHRRQ0BWMdTWrN97y6WWlaj5bNyIylnP_3U0Qa1kDobUYTUTyd0aeNhNQDABUl-ecQ_ZQQ8S8_EGLph7LFg6I54-4NV4kynu9EsuI87p-xpEBFIhnZGxigi3baioObez_9VRS9Jg2APBlKuvykUfJb1oMTiVifo2aElQeNgx7yTKo0/s970/rDJegQJaCyGaYysj2g5XWY-970-80.jpg.webp") center/cover no-repeat;
  perspective:1000px;
  padding:20px 0;
}

#logo { width:180px; margin:20px auto; display:block; }

.container { width:400px; margin:40px auto; height:auto; position:relative; }

.flip-card { width:100%; position:relative; transform-style:preserve-3d; transition:transform 0.8s ease; }

.form-box { width:100%; background:rgba(0,0,0,0.85); padding:40px; border-radius:8px; position:absolute; backface-visibility:hidden; top:0; left:0; }
.login-box { transform:rotateY(180deg); }

.form-box h1 { margin-bottom:20px; }
.form-box input[type=text],
.form-box input[type=password] { width:100%; height:45px; margin-bottom:10px; background:#333; border:none; color:white; padding-left:15px; border-radius:4px; }

.form-box label { font-size:14px; color:white; }
.form-box .checkbox { display:flex; align-items:center; gap:6px; margin-bottom:10px; }
.form-box .checkbox input[type=checkbox] { transform:scale(0.8); }

button { width:100%; height:45px; border:none; border-radius:4px; color:white; cursor:pointer; margin-bottom:10px; }
.red { background:red; } 
.gray { background:#444; }

.toggle { text-align:center; margin-top:15px; color:#2a82ff; cursor:pointer; font-size:14px; }

#footer { padding:40px; background:rgba(0,0,0,0.8); display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:15px; }
#footer p { color:gray; cursor:pointer; }
#select { width:200px; background:black; color:white; border:1px solid gray; padding:8px; }
</style>
</head>
<body>

<div id="bgimage">
  <img src="https://blogger.googleusercontent.com/img/b/R29vXsEhSlBPPqgWdrYbIXgymqH53Cg2CX6_UAMF1nf0n_MUVJNQ1pPxKlw7W8T0IXq4gXnxKSAOnD4eqQSFwcMKJY_2M2ECROdiQlD1_RF9ZqkqUwweca7HI2GSZkrdKQVamzXCe9QVq1Df1e9NNm7VnckKZhRavlENOgM3ATeLrEkv4qvFrBoBVfDbvX4quAVs/s1280/pngwing.com.png" id="logo">

  <div class="container">
    <div class="flip-card" id="flipCard">

      <!-- SIGN UP / CREATE ACCOUNT FORM -->
      <div class="form-box sign-in-box">
        <h1 id="signupTitle">Create Account</h1>
        <input type="text" id="signupName" placeholder="Name">
        <input type="text" id="signupEmail" placeholder="Email or mobile number">
        <input type="password" id="signupPassword" placeholder="Password">
        <input type="password" id="signupConfirm" placeholder="Confirm Password">
        
        <div class="checkbox">
          <input type="checkbox" id="terms">
          <label id="termsText">I agree to the Terms & Conditions</label>
        </div>
        <div class="checkbox">
          <input type="checkbox" id="newsletter">
          <label id="newsletterText">Subscribe to newsletter</label>
        </div>

        <button class="red" onclick="signup()" id="signupButton">Sign Up</button>
        <p class="toggle" onclick="flip()" id="goLogin">Go to Login</p>
      </div>

      <!-- LOGIN FORM -->
      <div class="form-box login-box">
        <h1 id="loginTitle">Login</h1>
        <input type="text" id="loginEmail" placeholder="Email or mobile number">
        <input type="password" id="loginPassword" placeholder="Password">

        <button class="red" onclick="login()" id="loginButton">Login</button>
        <p class="toggle" onclick="flip()" id="backSignup">Back to Sign Up</p>
      </div>

    </div>
  </div>
</div>

<!-- FOOTER -->
<div id="footer">
  <p id="f1">Questions? Call 000-800-919-1694</p>
  <p id="f2">FAQ</p>
  <p id="f3">Help Centre</p>
  <p id="f4">Terms of Use</p>
  <p id="f5">Privacy</p>
  <p id="f6">Cookie Preferences</p>
  <p id="f7">Corporate Information</p>

  <select id="select" onchange="changeLanguage(this.value)">
    <option value="en">English</option>
    <option value="hi">हिन्दी</option>
    <option value="es">Español</option>
    <option value="fr">Français</option>
    <option value="zh">中文</option>
    <option value="ar">العربية</option>
    <option value="ru">Русский</option>
  </select>
</div>

<script>
let flipped=false;
let users = {};
let currentLang='en';

function flip(){
  flipped = !flipped;
  document.getElementById("flipCard").style.transform =
    flipped ? "rotateY(180deg)" : "rotateY(0deg)";
}

// Sign Up function with validation
async function signup() {
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  const confirm = document.getElementById('signupConfirm').value;
  const terms = document.getElementById('terms').checked;

  if (!name || !email || !password || !confirm) {
    alert(messages[currentLang].fillAllFields);
    return;
  }
  if (password.length < 4) {
    alert(messages[currentLang].passwordShort);
    return;
  }
  if (password !== confirm) {
    alert(messages[currentLang].passwordMismatch);
    return;
  }
  if (!terms) {
    alert(messages[currentLang].agreeTerms);
    return;
  }

  try {
    const res = await fetch('/netlify/functions/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    });

    const data = await res.json();

    if (data.status === 'exists') {
      alert(messages[currentLang].emailExists);
      flip(); // go to login
    } else if (data.status === 'success') {
      alert(messages[currentLang].signupSuccess);
      flip(); // go to login
    } else {
      alert("Error: " + data.message);
    }

  } catch (err) {
    alert("Error: " + err.message);
  }
}

// Login function
async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;

  if (!email || !password) {
    alert(messages[currentLang].fillAllFields);
    return;
  }

  try {
    const res = await fetch('/netlify/functions/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (data.status === 'success') {
      alert(messages[currentLang].loginSuccess);
      window.location.href = "https://internetfloxmedia.netlify.app"; // aapka home page
    } else if (data.status === 'fail') {
      alert(messages[currentLang].invalidCredentials);
    } else {
      alert("Error: " + data.message);
    }

  } catch (err) {
    alert("Error: " + err.message);
  }
}

// Function to change language
function changeLanguage(lang){
  currentLang=lang;
  const l = messages[lang] || messages['en'];
  document.getElementById('signupTitle').innerText=l.signupTitle;
  document.getElementById('loginTitle').innerText=l.loginTitle;
  document.getElementById('signupButton').innerText=l.signupButton;
  document.getElementById('goLogin').innerText=l.goLogin;
  document.getElementById('backSignup').innerText=l.backSignup;
  document.getElementById('termsText').innerText=l.terms;
  document.getElementById('newsletterText').innerText=l.newsletter;
  document.getElementById('signupName').placeholder=l.namePlaceholder;
  document.getElementById('signupEmail').placeholder=l.emailPlaceholder;
  document.getElementById('signupPassword').placeholder=l.passwordPlaceholder;
  document.getElementById('signupConfirm').placeholder=l.confirmPlaceholder;
  for(let i=1;i<=7;i++){ document.getElementById('f'+i).innerText=l['f'+i]; }
}
</script>
